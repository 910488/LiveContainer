name: VisionLauncher
options:
  bundleIdPrefix: dev.visionlauncher
targets:
  VisionLauncher:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - Sources
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: YouTube
        LCLaunchURL: livecontainer://livecontainer-launch?bundle-name=com.google.ios.youtube123.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visionlauncher.youtube
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        CODE_SIGNING_ALLOWED: NO
